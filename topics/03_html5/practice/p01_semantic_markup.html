<!DOCTYPE html>
<!--
  ─── HTML5 Practice p01: Rewrite with Semantic Markup ───────────────────────

  TASK: The markup below uses only <div> and <span>.
  Rewrite it using appropriate HTML5 semantic elements.
  Also fix the accessibility issues.

  There are at least 10 improvements to make.
  ─────────────────────────────────────────────────────────────────────────────
-->

<!-- ─── BAD VERSION (div soup) ─────────────────────────────────────── -->
<div class="page">
  <div class="top">
    <div class="logo"><img src="/nab-logo.png"></div>
    <div class="links">
      <span onclick="goTo('/')">Home</span>
      <span onclick="goTo('/accounts')">Accounts</span>
      <span onclick="goTo('/payments')">Payments</span>
    </div>
  </div>

  <div class="content">
    <div class="sidebar">
      <div class="menu">
        <span onclick="goTo('/overview')">Overview</span>
        <span onclick="goTo('/history')">Transaction History</span>
      </div>
    </div>

    <div class="main-area">
      <div class="big-title">My Accounts</div>

      <div class="account">
        <div class="account-name">Everyday Account</div>
        <div class="balance">$2,450.00</div>
        <div class="date">Last updated: 15 Mar 2026</div>
        <div class="action" onclick="transfer()">Transfer</div>
        <div class="action" onclick="viewHistory()">View History</div>
      </div>

      <div class="article-block">
        <div class="article-title">Understanding Your Interest Rate</div>
        <div class="article-text">Your savings account earns...</div>
        <div class="article-image">
          <img src="/interest-chart.png">
          <div class="caption">Interest rate trends</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="copyright">© 2026 NAB</div>
    <div class="legal-links">
      <span>Privacy Policy</span>
      <span>Terms of Service</span>
    </div>
  </div>
</div>
